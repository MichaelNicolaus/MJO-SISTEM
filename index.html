<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Informasi MJO</title>
<meta name="description" content="Sistem informasi operasional tenant F&B MJO: stok, absensi, pendapatan, laporan otomatis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6E56'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EMJO%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div><p>Memuat sistem…</p></div>

<section id="login" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand big"><span class="logo">MJO</span><div><b>Sistem Informasi MJO</b><small>Operasional tenant F&amp;B</small></div></div>
    <label class="fld"><span>Username</span><input name="username" required autocomplete="username" autofocus></label>
    <label class="fld"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <p id="loginErr" class="err hidden"></p>
    <button class="btn primary block" type="submit">Masuk</button>
    <p id="loginHint" class="hint hidden"></p>
  </form>
</section>

<div id="shell" class="shell hidden">
  <aside id="side" class="side">
    <div class="brand"><span class="logo">MJO</span><div><b>Sistem MJO</b><small id="roleLabel"></small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who"><b id="whoName"></b><small id="whoUser"></small></div>
      <button class="btn ghost block" id="logoutBtn">Keluar</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu">☰</button>
      <div class="clock" id="clock" title="Waktu sistem"></div>
      <a class="bell" href="#/notifikasi" id="bell" aria-label="Notifikasi">Notifikasi <span id="bellCount" class="count hidden">0</span></a>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
